name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest  # Windows x86_64 (primary professional target)
          - macos-latest    # macOS arm64 (Apple Silicon) — also validates the
                            # macOS toolchain we cross-compile x86_64 from in
                            # release.yml. macos-13 (Intel) was deprecated by
                            # GitHub and was leaving CI runs queued forever.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # keyring v2 uses the OS-native secret store:
      #   macOS  → Keychain (no extra dependencies)
      #   Windows → Credential Manager (no extra dependencies)
      # No additional setup needed for either platform.

      - name: Run tests
        run: cargo test -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  render-artifacts:
    name: Render artifact worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify render worker syntax
        run: |
          node --check tools/vex-render-worker.mjs
          node --check tools/pressure-test-render-worker.mjs
          node --check tools/test-storey-tiling.mjs
          node --check tools/test-lod-profiles.mjs
          node --check tools/check-dashboard-syntax.mjs

      - name: Verify dashboard viewer module syntax
        run: node tools/check-dashboard-syntax.mjs

      - name: Verify render artifact fidelity and storey tiling
        run: |
          node tools/pressure-test-render-worker.mjs
          node tools/test-storey-tiling.mjs
          node tools/test-lod-profiles.mjs
